name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  compose:
    name: Compose stack, smoke test and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DC: docker compose -f compose.yaml -f docker/compose.healthcheck.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export host UID/GID for compose
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build and start stack (make init)
        id: init
        run: make init

      - name: Show stack status
        run: $DC ps

      - name: "Smoke test: /up returns 200"
        run: |
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/up || true)
            if [ "$status" = "200" ]; then
              echo "/up returned 200"
              exit 0
            fi
            sleep 2
          done
          echo "/up returned $status"
          exit 1

      - name: "Smoke test: migrations applied"
        run: |
          $DC exec -T app php artisan migrate:status | tee migrate-status.txt
          if grep -q 'Pending' migrate-status.txt; then
            echo "Pending migrations found"
            exit 1
          fi
          $DC exec -T app php artisan migrate --force

      - name: "Smoke test: seed database"
        run: $DC exec -T app php artisan db:seed --force

      - name: Run Laravel Pint
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: $DC exec -T app vendor/bin/pint --test

      - name: Run PHPStan
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: $DC exec -T app vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run PHPUnit
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: $DC exec -T app composer test

      - name: Dump container logs
        if: failure()
        run: $DC logs --no-color --tail=200

      - name: Tear down stack
        if: always()
        run: $DC down -v
