services:
  app:
    container_name: finsafe_app
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  node:
    container_name: finsafe_node
    image: node:22-bookworm
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5175:5173"
    command: >
      sh -c '
        lock_file_checksum="$$(sha256sum package-lock.json | cut -d " " -f 1)";
        if [ ! -x node_modules/.bin/vite ] || [ "$$(cat node_modules/.package-lock.sha256 2>/dev/null)" != "$$lock_file_checksum" ]; then
          npm ci && printf "%s" "$$lock_file_checksum" > node_modules/.package-lock.sha256;
        fi;
        exec npm run dev -- --host 0.0.0.0
      '

  nginx:
    container_name: finsafe_nginx
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    container_name: finsafe_db
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finsafe
      MYSQL_USER: finsafe
      MYSQL_PASSWORD: finsafe_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    container_name: finsafe_phpmyadmin
    image: phpmyadmin:5.2.1-apache
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    name: finsafe_db_data
  node_modules:
    name: finsafe_node_modules
