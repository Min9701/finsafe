# Overlay for compose.yaml, loaded by the Makefile (-f compose.yaml -f docker/compose.healthcheck.yaml).
# The app entrypoint runs `composer install` before php-fpm starts, so the container is only
# usable for artisan once vendor/autoload.php exists. `docker compose up --wait` blocks on this.
services:
  app:
    healthcheck:
      test: ["CMD-SHELL", "test -f vendor/autoload.php"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10s
